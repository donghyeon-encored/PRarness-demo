version: 1
repository: donghyeon-encored/PRarness-demo

runtime:
  contract: 1

dispatch:
  mode: human_pr_mention
  label: agent:run
  auto_on_open_for_trusted: true

publication:
  mode: codex_cloud_direct
  branch_prefix: agent/issue-

ownership:
  source: config
  fallback: donghyeon-encored
  max_issue_assignees: 1
  max_pr_assignees: 3
  people:
    - github: donghyeon-encored
      active: true
      responsibilities:
        domains:
          - frontend
          - recipe-scaling
        labels:
          - bug
        keywords:
          - recipe
          - scale
          - scaling
          - ingredient
          - fraction
        paths:
          - src/**
          - public/**
          - test/**
      review:
        can_review: true
        high_risk_domains: []
        high_risk_paths: []

validation:
  commands:
    - npm run lint
    - npm test

ci:
  required: true
  trigger: pull_request
  workflow: prarness-ci.yml
  app_slug: github-actions
  required_checks:
    - validation / PRarness validation
  timeout_seconds: 900
