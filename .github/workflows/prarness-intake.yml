name: PRarness Issue intake

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing source Issue number
        required: true
        type: number

permissions: read-all

concurrency:
  group: prarness-intake-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event_name != 'issue_comment' || !github.event.issue.pull_request
    permissions:
      contents: write
      issues: write
    uses: donghyeon-encored/PRarness/.github/workflows/reusable-intake.yml@b01117a625cbe7fc668d67d481252c3b1f6d7920
    with:
      runtime_ref: b01117a625cbe7fc668d67d481252c3b1f6d7920
