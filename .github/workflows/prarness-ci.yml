name: PRarness CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: prarness-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    uses: donghyeon-encored/PRarness/.github/workflows/reusable-validation.yml@ca501f41f594f7ac7a5f437650554a6c427c60ac
