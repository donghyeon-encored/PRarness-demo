name: PRarness CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: prarness-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    uses: donghyeon-encored/PRarness/.github/workflows/reusable-validation.yml@015f97ebd321ca5479d249449dec8d2e8866ec48
