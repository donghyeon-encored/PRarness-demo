name: PRarness CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: prarness-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    uses: donghyeon-encored/PRarness/.github/workflows/reusable-validation.yml@5aaa756b6a3f457296c0a904dd38978f10f274ad
