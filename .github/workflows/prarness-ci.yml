name: PRarness CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: prarness-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    uses: donghyeon-encored/PRarness/.github/workflows/reusable-validation.yml@b01117a625cbe7fc668d67d481252c3b1f6d7920
