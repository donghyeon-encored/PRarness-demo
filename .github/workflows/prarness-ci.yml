name: PRarness CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: prarness-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    uses: donghyeon-encored/PRarness/.github/workflows/reusable-validation.yml@a72e1d86cdfe0c146d6e5b885aee5ffb47a10d8a
